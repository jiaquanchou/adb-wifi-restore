<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1200" viewBox="0 0 1200 1200" role="img" aria-label="adb-wifi-restore social preview">
  <defs>
    <linearGradient id="bg2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0B1220"/>
      <stop offset="1" stop-color="#111F3A"/>
    </linearGradient>
    <linearGradient id="accent2" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#4C8DFF"/>
      <stop offset="1" stop-color="#8FC0FF"/>
    </linearGradient>
  </defs>

  <!-- full-bleed background; the center 1200x640 band is the GitHub social crop -->
  <rect width="1200" height="1200" fill="url(#bg2)"/>
  <rect x="24" y="304" width="1152" height="592" rx="16" fill="none" stroke="#22345A"/>

  <!-- wifi glyph -->
  <g transform="translate(255,570)">
    <circle cx="0" cy="60" r="13" fill="url(#accent2)"/>
    <g fill="none" stroke="url(#accent2)" stroke-width="13" stroke-linecap="round">
      <path d="M -32 28 A 45 45 0 0 1 32 28"/>
      <path d="M -60 0 A 85 85 0 0 1 60 0"/>
      <path d="M -88 -28 A 125 125 0 0 1 88 -28"/>
    </g>
  </g>

  <!-- wordmark -->
  <text x="420" y="548" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="66" font-weight="bold" fill="#F2F6FF" textLength="690" lengthAdjust="spacingAndGlyphs">adb-wifi-restore</text>
  <text x="422" y="610" font-family="Helvetica, Arial, sans-serif" font-size="30" fill="#9FB3D1" textLength="685" lengthAdjust="spacingAndGlyphs">Headless Wireless ADB Auto-Restorer · Android 11+</text>

  <!-- chips -->
  <g font-family="Helvetica, Arial, sans-serif" font-size="19">
    <rect x="422" y="690" width="150" height="38" rx="19" fill="#16294C" stroke="#2C4B85"/>
    <text x="497" y="715" text-anchor="middle" fill="#8FC0FF">Android 11+</text>
    <rect x="588" y="690" width="140" height="38" rx="19" fill="#16294C" stroke="#2C4B85"/>
    <text x="658" y="715" text-anchor="middle" fill="#8FC0FF">zero deps</text>
    <rect x="744" y="690" width="150" height="38" rx="19" fill="#16294C" stroke="#2C4B85"/>
    <text x="819" y="715" text-anchor="middle" fill="#8FC0FF">~33 KB APK</text>
    <rect x="910" y="690" width="140" height="38" rx="19" fill="#16294C" stroke="#2C4B85"/>
    <text x="980" y="715" text-anchor="middle" fill="#8FC0FF">Apache-2.0</text>
  </g>
</svg>
